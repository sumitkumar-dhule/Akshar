plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    id 'kotlin-kapt'
    alias(libs.plugins.hilt)
    alias(libs.plugins.google.services)
    alias(libs.plugins.compose.compiler)
}

// put at top-level of the module build.gradle (outside android{}), or inside a conditional block
def signingPropsFile = rootProject.file("signing-config.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

android {

    namespace 'com.electrodiligent.english'

    compileSdk 36

    defaultConfig {
        applicationId "com.electrodiligent.english"
        minSdk 23
        targetSdk 36

        // Use VERSION_CODE / VERSION_NAME from gradle.properties when present,
        // otherwise fall back to the previous hard-coded values.
        versionCode = (project.hasProperty('VERSION_CODE') ? project.VERSION_CODE.toInteger() : 34)
        if (project.hasProperty('VERSION_NAME')) {
            versionName = project.VERSION_NAME
        } else {
            versionName = "1.0.0"
        }


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (signingProps.containsKey('KEYSTORE_PASSWORD')) {
                storeFile file("${rootDir}/english-upload-keystore.jks")
                storePassword signingProps['KEYSTORE_PASSWORD']
                keyAlias signingProps['KEY_ALIAS']
                keyPassword signingProps['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

task printVersion {
    doLast {
        def vc = android.defaultConfig.versionCode
        def vn = android.defaultConfig.versionName
        println "Resolved versionCode = ${vc}"
        println "Resolved versionName = ${vn}"
    }
}

dependencies {

    // ----------------------------------
    // Compose BOM (single source of truth)
    // ----------------------------------
    implementation(platform(libs.androidx.compose.bom))

    // Compose core
    implementation(libs.androidx.ui.core)
    implementation(libs.androidx.ui.tooling.preview)
    implementation(libs.androidx.foundation)

    // Material 3 (LATEST)
    implementation(libs.androidx.material3.core)

    implementation(libs.material)

    // AndroidX
    implementation(libs.androidx.core.ktx)
    implementation(libs.androidx.activity.compose)
    implementation(libs.androidx.lifecycle.runtime.ktx)
    implementation(libs.androidx.lifecycle.viewmodel.compose)

    // Google Mobile Ads
    implementation(libs.play.services.ads)

    // Splash Screen
    implementation(libs.androidx.core.splashscreen)

    // Hilt
    implementation(libs.hilt.android)
    kapt(libs.hilt.compiler)
    implementation(libs.androidx.hilt.navigation.compose)

    // Modules
    implementation(project(":core"))

    // ------------------
    // Testing (BOM-safe)
    // ------------------
    testImplementation(libs.junit)
    androidTestImplementation(libs.androidx.junit)
    androidTestImplementation(libs.androidx.espresso.core)
    androidTestImplementation(libs.androidx.ui.test.junit4)

    // Debug
    debugImplementation(libs.androidx.ui.tooling)
    debugImplementation(libs.androidx.ui.test.manifest)
}
